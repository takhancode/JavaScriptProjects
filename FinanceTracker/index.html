<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
     <h1>GoodMorningandWelcome</h1>
    <div class="header-controls">
     <div class="dropdown">
        daily        
     </div>
     <div class="datepicker">
      
     </div>
     <div class="export-button">

     </div>
     </div> 
   </div>

   <div id="Dashboard">
    <div class="card">
        <div class="cardtitle">
        <p>Income</p>
      </div>
    </div>

    <div class="card">
        <div class="cardtitle">
        <p>Expense</p>
      </div>
    </div>

    <div class="card">
      <div class="cardtitle">
        <p>Balance</p>
      </div>
    </div>
   </div>

   <button id="addexpense">AddExpense</button>
   <button id="closebutton">Close</button>

   <div id="Overview">
    <div class="chartarea">

    </div>
    <div class="expensebreakdown">

    </div>
   </div>


   <div id="transactions">
      <table class="table">
    <thead>
        <tr>
            <th>Transactions</th>
            <th>Date</th>
            <th>Category</th>
        </tr>
    </thead>

    <tbody>
    <tr>
        <td>Row1</td>
        <td>Row2</td>
        <td>Row3</td>
    </tr>
    </tbody>
    </table>
   </div>

   <div id="expenseModal">
    <input type="text" id="expensename" placeholder="ExpenseName">
    <input type="text" id="expenseamount" placeholder="ExpenseAmount">
  <select  id="expensecategory">
    <option value="housing">Housing</option>
    <option value="utiliti">Utility</option>
    <option value="transportation">Transportation</option>
    <option value="healthcare">Healthcare</option>
  </select>
      <select  id="expensetype">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    <input type="date" id="expensedate">
    <button id="submit-btn" type="submit">Submit</button>
   </div>
  <script src="script.js"></script>
</body>
</html>
