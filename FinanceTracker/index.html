<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpenseTracker</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
     <h1>GoodMorningandWelcome</h1>
    <div class="header-controls">
     <div class="dropdown">
        Daily <i class="fas fa-chevron-down"></i>
     </div>
     <div class="datepicker">
      <i class="fas fa-calendar"></i>
      16 January 2025
     </div>
     <button class="export-btn">
      <i class="fas fa-download"></i>
      Export
      </button>
     </div> 
   </div>
   <div id="Dashboard">
   <div class="card">
    <div class="cardtitle">
        <p>Income</p>
    </div>
    <p id="incomeamount">0</p>
</div>

<div class="card">
    <div class="cardtitle">
        <p>Expense</p>
    </div>
    <p id="expenseamounttotal">0</p>
</div>

<div class="card">
    <div class="cardtitle">
        <p>Balance</p>
    </div>
    <p id="balanceamount">0</p>
</div>
</div>

   <button id="addexpense">AddExpense</button>
   <button id="closebutton">Close</button>

   <div id="Overview">
    <div class="chartarea">
   <p>chartarea</p>
    </div>
    <div class="expensebreakdown" id="breakdownlist">

    </div>
   </div>


   <div id="transactions">
      <table class="table">
        
    <thead>
        <tr>
            <th>Name</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Type</th>
            <th>Date</th>
        </tr>
    </thead>
   <tbody id="tablebody">
    <tr>
        <td>Row1</td>
        <td>Row2</td>
        <td>Row3</td>
        <td>Row4</td>
        <td>Row5</td>
    </tr>
    </tbody>
    </table>
   </div>
  <form id="submit-form">
   <div id="expenseModal">
    <input type="text" id="expensename" placeholder="ExpenseName">
    <input type="text" id="expenseamount" placeholder="ExpenseAmount">
  <select  id="expensecategory">
    <option value="housing">Housing</option>
    <option value="utility">Utility</option>
    <option value="transportation">Transportation</option>
    <option value="healthcare">Healthcare</option>
    <option value="other">Other</option>
  </select>
      <select  id="expensetype">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    <input type="date" id="expensedate">
    <button id="submit-btn" type="submit">Submit</button>
   </div>
   </form>
  <script src="script.js"></script>
</body>
</html>
