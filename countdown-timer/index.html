<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Countdown Timer</h1>
    <input  id="dateInput"  type="date">

    <div id="container">
     <div class="cards">

      <div class="card">
        <div class="card-text">
            <h2>0</h2>
            <h3>Days</h3>
        </div>
      </div>


      
      <div class="card">
        <div class="card-text">
            <h2>0</h2>
            <h3>Hours</h3>
        </div>
      </div>
       
      <div class="card">
        <div class="card-text">
            <h2>0</h2>
            <h3>Minutes</h3>
        </div>
      </div>


      <div class="card">
        <div class="card-text">
            <h2>0</h2>
            <h3>Seconds</h3>
        </div>
      </div>


     <button id="start">Start</button>
     <button id="stop">Stop</button>
     </div>


    </div>
    <script src="script.js"></script>
</body>
</html>
